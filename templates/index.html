      const mapel = document.getElementById("mapel");
      const bab = document.getElementById("bab");
      const button = document.getElementById("start");

      function updateMateri() {
        const selected = mapel.value;
        bab.innerHTML = "";

        materi[selected].forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          bab.appendChild(option);
        });
      }

      updateMateri();
      mapel.addEventListener("change", updateMateri);

      button.addEventListener("click", async function () {
        button.disabled = true;
        button.textContent = "Admin sedang membuat 10 soal...";

        try {
          const response = await fetch("/generate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              mapel: mapel.value,
              kelas: document.getElementById("kelas").value,
              bab: bab.value,
              kesulitan: document.getElementById("kesulitan").value,
            }),
          });

          const data = await response.json();

          if (!response.ok || data.error) {
            throw new Error(data.error || "Gagal membuat soal.");
          }

          sessionStorage.setItem("questions", JSON.stringify(data.questions));

          window.location.href = "/quiz";
        } catch (error) {
          alert(error.message || "Gagal menghubungi Admin.");
          button.disabled = false;
          button.textContent = "Buat 10 Soal Random";
